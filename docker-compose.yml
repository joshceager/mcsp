# One container: FastAPI backend + its managed Minecraft server.
# ALL persistence via BIND MOUNTS (no named volumes, per project decision).
#
#   mkdir -p data && docker compose up -d --build
#
# First boot provisions everything automatically: installs NeoForge for the
# pinned MC version, writes eula.txt + default server.properties, installs the
# pack's server-side mods, and auto-starts the server.
#
# Host-side steps the container cannot do for you: open/forward TCP 25565
# (Minecraft) and 8080 (API), firewall rules, DNS.
services:
  mcsp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcsp
    ports:
      - "8080:8080"     # REST API (public + admin; admin fails closed w/o key)
      - "25565:25565"   # Minecraft server
    environment:
      # Optional admin key. UNSET => admin endpoints fail closed (503).
      # Generate one: openssl rand -hex 32
      - MCSP_ADMIN_KEY=${MCSP_ADMIN_KEY:-}
      # Minecraft server JVM heap
      - MCSP_MEM_GB=${MCSP_MEM_GB:-4}
      # Minecraft game port (inside the container it is always 25565; use
      # MCSP_MC_PORT only if you remap the published port differently)
      - MCSP_MC_PORT=${MCSP_MC_PORT:-25565}
      # Auto-start the Minecraft server when the backend starts (default true)
      - MCSP_AUTO_START=${MCSP_AUTO_START:-true}
      # Auto-restart the server process if it crashes, capped exponential backoff
      - MCSP_AUTO_RESTART=${MCSP_AUTO_RESTART:-true}
      # Optional: the address players should join (published in /api/v1/status)
      # - MCSP_JOIN_ADDRESS=play.example.com
    volumes:
      # Bind mount: ALL server data (world, mods, config, backups, manifest,
      # sqlite job history) persists here on the host filesystem.
      - ./data:/data
    restart: unless-stopped
    tty: true
    stdin_open: true

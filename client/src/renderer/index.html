<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCSP Launcher</title>
    <style>
      :root {
        --bg: #0f1216; --panel: #161a21; --panel2: #1b2028; --border: #2c3441;
        --text: #e6e9ee; --muted: #8b96a5; --accent: #2b6cb0; --accent2: #3b82c4;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin:0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      .app { display: flex; flex-direction: column; height: 100vh; }
      .loading { padding: 40px; color: var(--muted); }

      /* top home bar */
      .homebar { display:flex; align-items:center; gap:10px; padding:8px 12px;
        background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .homebar-btn { background: var(--accent); color:#fff; border:0; border-radius:6px;
        padding:7px 16px; cursor:pointer; font-weight:600; }
      .homebar-btn:hover { background: var(--accent2); }
      .homebar-btn.icon { background: transparent; border:1px solid var(--border); padding:6px 10px; }
      .homebar-crumb { color: var(--muted); }

      .body { display:flex; flex: 1 1 auto; min-height: 0; }

      /* sidebar */
      .sidebar { width: 240px; flex: 0 0 auto; background: var(--panel);
        border-right: 1px solid var(--border); display:flex; flex-direction: column; }
      .sidebar-head { padding: 12px 14px 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: .08em; color: var(--muted); }
      .sidebar-list { flex: 1 1 auto; overflow-y: auto; padding: 4px 8px; }
      .conn-item { display:flex; align-items: stretch; gap:4px; margin-bottom:4px; border-radius:8px; }
      .conn-item.active { background: var(--panel2); outline: 1px solid var(--accent); }
      .conn-btn { flex:1; background: transparent; border:0; color: var(--text); text-align:left;
        padding:8px 10px; cursor:pointer; border-radius:8px; display:flex; flex-direction:column; gap:2px; }
      .conn-btn:hover { background: var(--panel2); }
      .conn-name { font-weight:600; }
      .conn-url { font-size:11px; color: var(--muted); word-break: break-all; }
      .conn-del { background: transparent; border:0; color: var(--muted); cursor:pointer; padding:0 8px; }
      .conn-del:hover { color: #ff8a8a; }
      .sidebar-add { margin: 8px; padding: 10px; background: var(--accent); color:#fff; border:0;
        border-radius:8px; cursor:pointer; font-weight:600; }
      .sidebar-add:hover { background: var(--accent2); }

      /* main content */
      .content { flex: 1 1 auto; overflow-y: auto; padding: 16px; min-width: 0; }
      .tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:14px; }
      .tile { background: var(--panel); border:1px solid var(--border); border-radius:12px;
        padding:18px 14px; cursor:pointer; text-align:center; color: var(--text); }
      .tile:hover { border-color: var(--accent); background: var(--panel2); }
      .tile-icon { width:56px; height:56px; margin: 0 auto 10px; border-radius:14px;
        background: var(--accent); color:#fff; font-size:26px; font-weight:700;
        display:flex; align-items:center; justify-content:center; }
      .tile-name { font-weight:600; }
      .tile-url { font-size:11px; color: var(--muted); word-break: break-all; margin-top:4px; }

      /* server view */
      .server-head { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
      .server-head h1 { margin:0; font-size:20px; }
      .tabs { display:flex; gap:6px; }
      .tab { background: var(--panel); color: var(--text); border:1px solid var(--border);
        border-radius:8px; padding:7px 14px; cursor:pointer; }
      .tab.active { background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }

      /* shared widgets */
      button { background: var(--accent); color:#fff; border:0; border-radius:6px;
        padding:8px 14px; cursor:pointer; margin:2px; }
      button:hover { background: var(--accent2); }
      button:disabled { opacity:.5; cursor:default; }
      button.danger { background:#b02b2b; }
      button.secondary { background: var(--panel2); border:1px solid var(--border); }
      input, select { background: var(--panel2); color: var(--text); border:1px solid var(--border);
        border-radius:6px; padding:6px 8px; }
      table { border-collapse: collapse; width:100%; margin-top:8px; }
      th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); }
      .tag { border-radius:10px; padding:1px 8px; font-size:12px; }
      .tag.client { background:#1f5e38; } .tag.server { background:#5e2a1f; } .tag.both { background:#1f4e5e; }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .panel { background: var(--panel); border:1px solid var(--border); border-radius:10px;
        padding:14px; margin-bottom:14px; }
      pre { background:#0d1015; padding:10px; border-radius:8px; max-height:260px; overflow:auto; font-size:12px; }
      h2 { margin: 4px 0 10px; }
      .ok { color:#7ddc9a; } .err { color:#ff8a8a; } .muted { color: var(--muted); }
      .spacer { flex: 1; }
      .form { max-width: 460px; }
      .form-grid { display:grid; grid-template-columns: 100px 1fr; gap:8px 10px; align-items:center; margin-bottom:10px; }

      /* bottom log strip */
      .logbar { flex: 0 0 auto; max-height: 140px; overflow: hidden; border-top: 1px solid var(--border);
        background: #0d1015; padding: 4px 12px; }
      .logbar-title { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing:.08em; }
      .logbar pre { background: transparent; max-height: 100px; margin: 0; padding: 2px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCSP Launcher</title>
    <style>
      :root {
        --bg: #0f1216; --panel: #161a21; --panel2: #1b2028; --border: #2c3441;
        --text: #e6e9ee; --muted: #8b96a5; --accent: #2b6cb0; --accent2: #3b82c4;
        --danger: #b02b2b; --ok: #7ddc9a; --warn: #e0b341;
        --sidebar-w: 240px;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin:0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text);
        overflow: hidden; }
      .app { display: flex; flex-direction: column; height: 100vh; }
      .loading { padding: 40px; color: var(--muted); }

      /* top bar */
      .homebar { display:flex; align-items:center; gap:10px; padding:8px 12px;
        background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .homebar-btn { background: var(--accent); color:#fff; border:0; border-radius:6px;
        padding:7px 16px; cursor:pointer; font-weight:600; }
      .homebar-btn:hover { background: var(--accent2); }
      .homebar-btn.icon { background: transparent; border:1px solid var(--border); padding:6px 10px; }
      .homebar-crumb { color: var(--muted); }
      .spacer { flex: 1 1 auto; }

      .body { display:flex; flex: 1 1 auto; min-height: 0; position: relative; }

      /* sidebar */
      .sidebar { width: var(--sidebar-w); flex: 0 0 auto; background: var(--panel);
        border-right: 1px solid var(--border); display:flex; flex-direction: column; min-height: 0; }
      .sidebar-head { padding: 12px 14px 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: .08em; color: var(--muted); display:flex; justify-content:space-between; }
      .sidebar-list { flex: 1 1 auto; overflow-y: auto; padding: 4px 8px; min-height: 0; }
      .conn-item { display:flex; align-items: stretch; gap:2px; margin-bottom:4px; border-radius:8px; }
      .conn-item.active { background: var(--panel2); outline: 1px solid var(--accent); }
      .conn-btn { flex:1; background: transparent; border:0; color: var(--text); text-align:left;
        padding:8px 10px; cursor:pointer; border-radius:8px; display:flex; flex-direction:column; gap:2px; min-width:0; }
      .conn-btn:hover { background: var(--panel2); }
      .conn-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .conn-url { font-size:11px; color: var(--muted); word-break: break-all; }
      .icon-btn { background: transparent; border:0; color: var(--muted); cursor:pointer;
        padding:0 6px; font-size:15px; line-height:1; border-radius:6px; }
      .icon-btn:hover { color: var(--text); background: var(--panel2); }
      .icon-btn.danger:hover { color: #ff8a8a; }
      .sidebar-add { margin: 8px; padding: 10px; background: var(--accent); color:#fff; border:0;
        border-radius:8px; cursor:pointer; font-weight:600; }
      .sidebar-add:hover { background: var(--accent2); }

      /* main content */
      .content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 16px; min-width: 0; }
      .tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap:14px; }
      .tile { background: var(--panel); border:1px solid var(--border); border-radius:12px;
        padding:18px 14px; cursor:pointer; text-align:center; color: var(--text); min-width:0; }
      .tile:hover { border-color: var(--accent); background: var(--panel2); }
      .tile-icon { width:56px; height:56px; margin: 0 auto 10px; border-radius:14px;
        background: var(--accent); color:#fff; font-size:26px; font-weight:700;
        display:flex; align-items:center; justify-content:center; }
      .tile-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .tile-url { font-size:11px; color: var(--muted); word-break: break-all; margin-top:4px; }

      /* server view */
      .server-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
      .server-head h1 { margin:0; font-size:20px; overflow:hidden; text-overflow:ellipsis; }
      .tabs { display:flex; gap:6px; flex-wrap:wrap; }
      .tab { background: var(--panel); color: var(--text); border:1px solid var(--border);
        border-radius:8px; padding:7px 14px; cursor:pointer; }
      .tab.active { background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }

      /* shared widgets */
      button { background: var(--accent); color:#fff; border:0; border-radius:6px;
        padding:8px 14px; cursor:pointer; margin:2px; font: inherit; }
      button:hover { background: var(--accent2); }
      button:disabled { opacity:.5; cursor:default; }
      button.danger { background: var(--danger); }
      button.secondary { background: var(--panel2); border:1px solid var(--border); }
      button.link { background:none; border:0; color: var(--accent2); text-decoration: underline; padding:2px 4px; }
      input, select, textarea { background: var(--panel2); color: var(--text); border:1px solid var(--border);
        border-radius:6px; padding:6px 8px; font: inherit; max-width: 100%; }
      table { border-collapse: collapse; width:100%; margin-top:8px; }
      th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); }
      .table-wrap { overflow-x: auto; }
      .tag { border-radius:10px; padding:1px 8px; font-size:12px; white-space: nowrap; }
      .tag.client { background:#1f5e38; } .tag.server { background:#5e2a1f; } .tag.both { background:#1f4e5e; }
      .tag.ok { background:#1f5e38; } .tag.warn { background:#5e4a1f; } .tag.err { background:#5e1f1f; }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .panel { background: var(--panel); border:1px solid var(--border); border-radius:10px;
        padding:14px; margin-bottom:14px; min-width: 0; }
      pre { background:#0d1015; padding:10px; border-radius:8px; max-height:260px; overflow:auto; font-size:12px;
        margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
      h1 { margin: 0 0 12px; font-size: 20px; }
      h2 { margin: 4px 0 10px; font-size: 16px; }
      .ok { color: var(--ok); } .err { color: #ff8a8a; } .muted { color: var(--muted); }
      .warn { color: var(--warn); }
      .banner { border-radius:8px; padding:8px 12px; margin-bottom:12px; border:1px solid var(--border); }
      .banner.err { background:#2a1616; border-color:#5e2a2a; }
      .banner.warn { background:#2a2416; border-color:#5e4a1f; }
      .banner.ok { background:#16281d; border-color:#2a5e3a; }
      .form-grid { display:grid; grid-template-columns: 110px minmax(0,1fr); gap:8px 10px; align-items:center; }
      .form-grid label { color: var(--muted); }
      .form-grid input, .form-grid select { width: 100%; }
      .kv { display:grid; grid-template-columns: max-content minmax(0,1fr); gap:2px 12px; }
      .kv dt { color: var(--muted); }
      .kv dd { margin:0; word-break: break-word; }
      .progress { height:6px; background: var(--panel2); border-radius:4px; overflow:hidden; margin-top:8px; }
      .progress > div { height:100%; background: var(--accent); }
      .stack { display:flex; flex-direction:column; gap:8px; }
      .jobs-table td { vertical-align: top; }
      .job-detail { background:#0d1015; border-radius:8px; }

      /* modal */
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55);
        display:flex; align-items:center; justify-content:center; padding: 16px; z-index: 50; }
      .modal { background: var(--panel); border:1px solid var(--border); border-radius:12px;
        padding: 18px; width: min(520px, 100%); max-height: 90vh; overflow:auto; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
      .modal h2 { margin-top: 0; }
      .modal-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }

      /* bottom log strip */
      .logbar { flex: 0 0 auto; max-height: 160px; overflow: hidden; border-top: 1px solid var(--border);
        background: #0d1015; padding: 4px 12px 8px; display:flex; flex-direction:column; }
      .logbar-head { display:flex; align-items:center; gap:8px; }
      .logbar-title { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing:.08em; flex:1; }
      .logbar pre { background: transparent; max-height: 110px; margin: 0; padding: 2px 0; }

      /* narrow windows: the sidebar must not eat half the screen */
      @media (max-width: 700px) {
        .sidebar { position: absolute; top:0; bottom:0; left:0; z-index: 20;
          box-shadow: 4px 0 18px rgba(0,0,0,.4); }
        .content { padding: 12px; }
        .form-grid { grid-template-columns: minmax(0,1fr); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
